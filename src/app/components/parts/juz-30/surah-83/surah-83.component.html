<app-surah-hint
  [surahName]="'المطففين'"
  [hintText]="'وفي ذلك فليتنافس المتنافسون'">
</app-surah-hint>

<!--visa en next och before meny-->
<app-next-before-surah-meny [SurahBefore]="'الإنفطار'"
                            [SurahNext]="'الانشقاق'"
></app-next-before-surah-meny>


<app-surah-tabs [surahName]="'سورة المطففين'">
  <div tadabbur>
  <app-surahs-start></app-surahs-start>
  <!-- här lägger tafser för du den första part taddabur -->
   <div class="verse-wrapper">
      <div class="verse-block" *ngFor="let verse of verses; let i = index">
        <div class="verse-line" (click)="toggleVerse(i)">
          <p class="ayah">{{ verse.text }}</p>
          <div class="ayah-arrow"> 
            <span class="ayah-number">﴿{{ verse.number }}﴾</span>
            <span class="arrow" [class.open]="shown.has(i)">▼</span>
          </div>
        </div>
        <div class="tafsir" *ngIf="shown.has(i)">
  <!-- زر القراءة الصوتية -->
<!-- التعديل في الـ HTML -->
<button (click)="speakTafseer(verse.tafsir || '')" class="audio-btn">
    🔊 استمع للتفسير
</button>
  
  <!-- نص التفسير الأصلي -->
  <div [innerHTML]="verse.tafsir"></div>
</div>
      </div>
    </div>
  </div>
     
   
  <div visual>
   <div class="intro-summary">
       <h3>ملخص السورة:</h3>
       <p> </p>
   </div>
    <!-- parts i visual delen -->
    <div *ngFor="let section of rubtTassweerySections; let i = index" class="map-block">
  <h3 class="section-title">{{ section.title }}</h3>
  <p class="section-desc">{{ section.description }}</p>
  
  <ul class="verse-list">
    <!-- Huvudvers -->
    <li class="verse-item verse-main">
      <span class="verse-text">{{ getVerseText(section.verseNumbers[0]) }}</span>
      <button
        *ngIf="section.verseNumbers.length > 1"
        class="toggle-btn"
        (click)="toggleExpanded(i)">
        {{ expandedSections[i] ? '↑' : '⋮' }}
      </button>
    </li>

    <!-- Extra verser -->
    <li
      *ngFor="let num of section.verseNumbers.slice(1); let j = index"
      class="verse-item"
      [class.extra]="true"
      [class.show]="expandedSections[i]">
      {{ getVerseText(num) }}
    </li>
  </ul>
</div>

  </div>
</app-surah-tabs>

<!--visa var ifrån information-->
<p style="text-align:center; font-size:12px; color:#666; margin-top:10px;">
    📚 مصدر التفسير: <b> أبو بكر الجزائري (١٤٣٩ هـ) _ تفسير السعدي</b>
</p>

<!--visa en next och before meny-->
<app-next-before-surah-meny [SurahBefore]="'الإنفطار'"
                            [SurahNext]="'الانشقاق'"
></app-next-before-surah-meny>


<!--visa frågot om surah-->
<div class="quiz-section">
      <app-quix-tafser [questions]="abassaQuestions"></app-quix-tafser>
</div>


<app-fawaed-of-surah
  [SurahFaidah]="'المطففين'"
  [FaidaText]="
    '<ul class=\'benefit-list\'>
      <li>
        <strong> الوعيد لمغتصبي الأموال:</strong>
        <br>
        أنه إذا كان الوعيدُ على الذين يبخسون الناس بالمكيال والميزان، 
        فالذي يأخذ أموالهم قهراً أو سرقةً، أولى بهذا الوعيد من المطففين.
      </li>
      <li>
        <strong> وجوب أداء الحقوق:</strong>
        <br>
        أن الإنسان كما يأخذُ من الناس الذي له، يجبُ عليه أن يعطيَهُم كلَّ ما لهم، 
        من الأموال والحقوق وغيرها.
      </li>
      <li>
        <strong> الجمع بين الشح والبخل:</strong>
        <br>
        أن المطففين جمعوا بين أمرين: 
        <strong>الشح</strong> في طلب حقهم كاملاً بدون مراعاة، 
        و<strong>البخل</strong> في منع ما يجب عليهم من إتمام الكيل والوزن.
        <br>
        وهذا المثال يقاسُ عليه كلُّ من طلب حقَّه كاملاً ومنع الحقَّ الذي عليه.
      </li>
      <li>
        <strong> معاني الظن في القرآن:</strong>
        <br>
        الأصلُ في الظنِّ عدمُ التيقُّنِ، ولكنه يأتي بمعنى <strong>اليقين</strong> في لغة العرب، 
        كما في قوله تعالى: ﴿الَّذِينَ يَظُنُّونَ أَنَّهُم مُّلَاقُوا رَبِّهِمْ﴾ أي: يوقنون.
      </li>
      <li>
        <strong> بلاغة الإنكار في الآيات:</strong>
        <br>
        وصفُ اليوم بالعظيم، وقيامُ الناس فيه لله خاضعين، ووَصْفُ ذاته بـ ﴿رَبِّ الْعَالَمِينَ﴾ 
        هو بيانٌ بليغٌ لعظيمِ الذنبِ وتفاقُم الإثم في التطفيف والحَيْفِ وترك القسط.
      </li>
      <li>
        <strong> خطورة الران وعقوبات الذنوب:</strong>
        <br>
        التحذيرُ من الذنوب، فإنها تَرينُ على القلب وتغطّيه شيئاً فشيئاً، 
        حتى ينطمس نوره، وتموت بصيرتُه، فتنقلب عليه الحقائقُ، 
        فـيـرى الباطل حقاً، والحق باطلاً.
      </li>
      <li>
        <strong> إثبات رؤية الله عز وجل:</strong>
        <br>
        استدلَّ أهل السنة والجماعة على ثبوت رؤية الله بقوله تعالى: 
        ﴿كَلَّا إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٍ لَّمَحْجُوبُونَ﴾.
        <br>
        ووجه الدلالة: أنه لما حُجِب الفجار في حال السَّخَط، 
        دَلَّ على أن الأبرار يَرونه سبحانه في حال الرِّضا.
      </li>
    </ul>'"
></app-fawaed-of-surah>
