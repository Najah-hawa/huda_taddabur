<div class="hadith-page-container">

   <div class="hadith-page-container">

<div #hadithBox class="fawaed-box-container mini hadith-main-box" [class.full-presentation]="isRawiMaximized" style="margin-top: 25px; position: relative;">

  <div class="box-container ">
    <app-zoom-controls
      [isMaximized]="isRawiMaximized" (onToggle)="toggleRawiZoom(hadithBox)" (onZoomIn)="zoomInRawi()" (onZoomOut)="zoomOutRawi()">
    </app-zoom-controls>
  </div>
  <div class="verse-wrapper" [style.margin-top]="isRawiMaximized ? '70px' : '35px'">
    <div class="verse-block hadith-main-block-modern">
      <div class="hadith-audio-trigger-wrapper">
        

 <!-- المبدل الصوتي الجديد والمطور (Audio Player Controls) -->
<!-- المبدل الصوتي الجديد والمطور (Audio Player Controls) -->
<div class="hadith-audio-player-wrapper">
  
  <!-- أزرار التحكم الذكية بالحديث (جملة جملة) -->
  <div class="hadith-player-buttons">
    
  
        <!-- ⏩ الزر اللي على اليمين بيرجع للجملة السابقة -->
    <button class="player-nav-btn" (click)="skipToPreviousPhrase()" title="الجملة السابقة">
      ⏭️
    </button>
    
    <button class="modern-hadith-audio-btn-expanded" (click)="playHadithAudio(hadith.audioUrl)">
      {{ isPlaying ? '⏸️ إيقاف مؤقت' : '▶️ استمع لنسب الرسول محمد ﷺ' }}
    </button>
    
  <!-- ⏪ الزر اللي على اليسار بيقدم للجملة التالية -->
    <button class="player-nav-btn" (click)="skipToNextPhrase()" title="الجملة التالية">
      ⏮️
    </button>
  </div>

  <!-- شريط التحكم بالوقت (Progress Slider) -->
  <div class="hadith-player-slider-container">
    <span class="time-indicator text-left">{{ currentTime | number:'1.0-0' }}ث</span>
    
    <input 
      type="range" 
      [min]="0" 
      [max]="duration" 
      [value]="currentTime" 
      (input)="onSliderChange($event)"
      class="hadith-audio-slider" />
      
    <span class="time-indicator text-right">{{ duration | number:'1.0-0' }}ث</span>
  </div>

</div>



      </div>
      <div class="hadith-text-full-width">
        <p class="Hadith" [style.font-size.px]="fontSizeRawi + 4" style="line-height: 2 !important; max-width: 100%;">
          @for (phrase of hadith.phrases; track $index) {
            <span [class.highlighted-phrase]="$index === currentPhraseIndex">
              {{ phrase.text }}
            </span>
          }
        </p>
      </div>
   
    </div>
  </div>
</div>

  <!-- الحاوية 2: فوائد الحديث (Box 1) -->
<div #box1 class="fawaed-box-container mini box1-container" [class.full-presentation]="isBox1Maximized" style="margin-top: 25px; position: relative;">


  <app-zoom-controls
    [isMaximized]="isBox1Maximized"  
    (onToggle)="toggleBox1Zoom(box1)" 
    (onZoomIn)="zoomInBox1(box1)" 
    (onZoomOut)="zoomOutBox1(box1)">
  </app-zoom-controls>

  
  <h2 class="benefit-title" style="font-size: 1.2em; margin: 0; font-weight: bold;">📌 حكم و أداب النصيحة  </h2>

  <div class="box-list-wrapper">
  <ul class="custom-presentation-list">
    <!-- استخدام الطريقة العادية ومسح innerHTML يضمن ظهورها 100% على Vercel -->
    <li *ngFor="let item of box1Items">
      <span [textContent]="item"></span>
    </li>
  </ul>
 </div>
</div>



</div>

<app-footer-info />
