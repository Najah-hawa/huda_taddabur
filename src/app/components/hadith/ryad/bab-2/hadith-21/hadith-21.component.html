<div class="hadith-page-container">

  <app-next-before-surah-meny
     [RoutelinkBefore]="'/hadith/ryad/bab-2/hadith-20'" [SurahBefore]="'الحديث السابق'"
     [RoutelinkAfter]="'/hadith/ryad/bab-2/hadith-22'" [SurahNext]="'الحديث التالي'">
  </app-next-before-surah-meny>

<div #hadithBox class="fawaed-box-container mini hadith-main-box" [class.full-presentation]="isRawiMaximized" style="margin-top: 25px; position: relative;">

  <div class="box-container ">
    <app-zoom-controls
      [isMaximized]="isRawiMaximized" (onToggle)="toggleRawiZoom(hadithBox)" (onZoomIn)="zoomInRawi()" (onZoomOut)="zoomOutRawi()">
    </app-zoom-controls>
  </div>
  
  <div class="verse-wrapper" [style.margin-top]="isRawiMaximized ? '20px' : '0px'">
    <div class="hadith-audio-trigger-wrapper">
  
      <!-- المبدل الصوتي الجديد والمطور (Audio Player Controls) -->
      <div class="hadith-audio-player-wrapper">
        
        <!-- أزرار التحكم الذكية بالحديث (تقديم وتأخير 10 ثوانٍ) -->
        <div class="hadith-player-buttons">
          
          <!-- ⏩ الزر اللي على اليمين بيرجع للخلف 10 ثوانٍ -->
          <button class="player-nav-btn" (click)="skipToPreviousPhrase()" title="تأخير 10 ثوانٍ">
            ⏪
          </button>
          
          <button class="modern-hadith-audio-btn-expanded" (click)="playHadithAudio(hadith.audioUrl)" [disabled]="isLoadingAudio">
            <!-- 1. حالة التحميل -->
            <ng-container *ngIf="isLoadingAudio">
              <span class="audio-spinner"></span>
              جاري التحميل...
            </ng-container>

            <!-- 2. الحالة العادية -->
            <ng-container *ngIf="!isLoadingAudio">
              {{ isPlaying ? '⏸️ إيقاف مؤقت' : '▶️ استمع للحديث' }}
            </ng-container>
          </button>
          
          <!-- ⏪ الزر اللي على اليسار بيقدم للأمام 10 ثوانٍ -->
          <button class="player-nav-btn" (click)="skipToNextPhrase()" title="تقديم 10 ثوانٍ">
            ⏩
          </button>
        </div>

        <!-- شريط التحكم بالوقت (Progress Slider) -->
        <div class="hadith-player-slider-container">
          <span class="time-indicator text-left">{{ currentTime | number:'1.0-0' }}ث</span>
          
          <input 
            type="range" 
            [min]="0" 
            [max]="duration" 
            [value]="currentTime" 
            (input)="onSliderChange($event)"
            class="hadith-audio-slider" />
            
          <span class="time-indicator text-right">{{ duration | number:'1.0-0' }}ث</span>
        </div>

      </div>

    </div>
     
    <h2 class="benefit-title" style="font-size: 1.2em; margin-top: 15px; padding:0; font-weight: bold;">الحديث التاسع</h2>

    <!-- 🖼️ حاوية الصورة مضاف إليها التجاوب وإدارة التدفق عند التكبير -->
    <div class="hadith-image-container" [style.overflow]="isRawiMaximized ? 'auto' : 'visible'">
      
      <!-- 🔍 ربط ستايل التكبير (Transform Scale) برمجياً مع دوال الـ TS لشاشات الـ TV -->
      <img 
        [src]="hadithImages[currentImageIndex]" 
        alt="الحديث 9 من باب 2. الرجاء الاتصال بالانترنيت لتحميل الصورة" 
        class="responsive-hadith-img fix-tilt"
        [style.transform]="'scale(' + imageScale + ')'"
        [style.max-height]="isRawiMaximized ? '85vh' : 'none'">

      <!-- 🛠️ شريط التحكم السفلي (الأسهم والمؤشر): يظهر فقط إذا كان هناك أكثر من صورة كالسلايدر -->
      <div *ngIf="hadithImages.length > 1" class="carousel-controls">
        
        <!-- سهم الانتقال للصورة السابقة (يمين) -->
        <button 
          class="carousel-btn prev-btn" 
          (click)="prevImage()"
          [disabled]="currentImageIndex === 0">
          ▶️
        </button>

        <!-- مؤشر الأرقام في المنتصف (مثل: 1 / 7) -->
        <div class="carousel-indicator">
          {{ currentImageIndex + 1 }} / {{ hadithImages.length }}
        </div>

        <!-- Sسهم الانتقال للصورة التالية (يسار) -->
        <button 
          class="carousel-btn next-btn" 
          (click)="nextImage()"
          [disabled]="currentImageIndex === hadithImages.length - 1">
          ◀️
        </button>

      </div>

    </div>

    <div class="tafsir-toggle-wrapper">
      <button class="modern-tafsir-toggle-btn" (click)="toggleExplanation()">
        <span>📚 شرح الحديث والمفردات</span>
        <span class="arrow" [class.open]="isExplanationShown">▼</span>
      </button>
    </div>

    <div class="tafsir-modern-box" *ngIf="isExplanationShown"
         [style.font-size.px]="fontSizeRawi"
         [style.--current-zoom.px]="fontSizeRawi">
      <div class="tafsir-header-row">
        <strong class="explanation-title-modern">📝 المفردات والشرح:</strong>
      </div>

      <div [innerHTML]="hadith.explanation" class="tafsir-content-inner"></div>
      <div class="bottom-close-wrapper">
        <button class="modern-tafsir-close-btn-bottom" (click)="closeExplanationAndScroll(hadithBox)">
          ❌ إغلاق شرح المفردات
        </button>
      </div>
    </div>

  </div>
</div>
  <!-- الحاوية 2: فوائد الحديث (Box 1) -->
<div #box1 class="fawaed-box-container mini box1-container" [class.full-presentation]="isBox1Maximized" style="margin-top: 25px; position: relative;">

  <app-zoom-controls
    [isMaximized]="isBox1Maximized"  
    (onToggle)="toggleBox1Zoom(box1)" 
    (onZoomIn)="zoomInBox1(box1)" 
    (onZoomOut)="zoomOutBox1(box1)">
  </app-zoom-controls>

  <h2 class="benefit-title" style="font-size: 1.2em; margin: 0; font-weight: bold;">📌 نبذة عن الراوي</h2>

   <div class="box-list-wrapper">
    <ul class="custom-presentation-list">
      <li *ngFor="let item of box1Items" [innerHTML]="item"></li>
    </ul>
  </div>

</div>

  <!-- الحاوية 3: أهمية الحديث (Box 2) -->

  <div #box2 class="fawaed-box-container mini box2-container" [class.full-presentation]="isBox2Maximized" style="margin-top: 25px; position: relative;">

  <app-zoom-controls
    [isMaximized]="isBox2Maximized"  
    (onToggle)="toggleBox2Zoom(box2)" 
    (onZoomIn)="zoomInBox2(box2)" 
    (onZoomOut)="zoomOutBox2(box2)">
  </app-zoom-controls>

  <h2 class="benefit-title" style="font-size: 1.2em; margin: 0; font-weight: bold;">📌  فوائد الحديث</h2>

  <div class="box-list-wrapper">
    <ul class="custom-presentation-list">
      <li *ngFor="let item of box2Items" [innerHTML]="item"></li>
    </ul>
  </div>
</div>



 </div>

<app-footer-info />
