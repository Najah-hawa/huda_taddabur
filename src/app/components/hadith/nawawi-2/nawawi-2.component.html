<div class="hadith-page-container">
  <app-surah-hint
    [surahName]="hadith.title + ': ' + hadith.name"
    [hintText]="hadith.hintText">
  </app-surah-hint>

  <app-next-before-surah-meny 
    [RoutelinkBefore]="'/hadith/nawawi-1'" [SurahBefore]="'الحديث الأول'"
    [RoutelinkAfter]="'/hadith/nawawi-2'"  [SurahNext]="'الحديث الثالث'"> 
  </app-next-before-surah-meny>

  <div class="verse-wrapper" style="margin-top: 20px;">
    <div class="verse-block hadith-main-block-modern">
      
      <div class="hadith-audio-trigger-wrapper">
        <button class="modern-hadith-audio-btn" (click)="playHadithAudio(hadith.audioUrl)">
          {{ isPlaying ? '⏸️ إيقاف مؤقت للحديث' : '▶️ استمع لمتن الحديث' }}
        </button>
      </div>

      <div class="hadith-text-full-width">
        <p class="ayah">
          @for (phrase of hadith.phrases; track $index) {
            <span [class.highlighted-phrase]="$index === currentPhraseIndex">
              {{ phrase.text }} 
            </span>
          }
        </p>
      </div>

      <div class="tafsir-toggle-wrapper">
        <button class="modern-tafsir-toggle-btn" (click)="toggleExplanation()">
          <span>📚 شرح الحديث والمفردات</span>
          <span class="arrow" [class.open]="isExplanationShown">▼</span>
        </button>
      </div>
      
      <div class="tafsir-modern-box" *ngIf="isExplanationShown">
        
        <div class="tafsir-header-row">
          <strong class="explanation-title-modern">📝 المفردات والشرح:</strong>
          
          <div class="tafsir-audio-actions">
            <button (click)="speakText(hadith.explanation)" class="modern-tafsir-audio-btn">
              {{ !isSpeakingTafsir ? '🔊 استمع للشرح' : (isTafsirPaused ? '▶️ استئناف' : '⏸️ إيقاف مؤقت') }}
            </button>

            <button *ngIf="isSpeakingTafsir" (click)="stopSpeakingTafsir()" class="modern-tafsir-stop-btn">
              🛑
            </button>
          </div>
        </div>

        <div [innerHTML]="hadith.explanation"></div>
      </div>

    </div>
  </div>
  
  <div class="fawaed-box-container mini" [class.full-presentation]="isBox1Maximized" style="margin-top: 25px;">
    <div class="fawaed-zoom-control" (click)="toggleBox1Zoom()">
      <span *ngIf="!isBox1Maximized">🔍 تكبير العرض</span>
      <span *ngIf="isBox1Maximized" class="close-symbol">✕ إنهاء العرض</span>
    </div>

    <h3 class="benefit-title">📌 أهمية حديث {{ hadith.name }}</h3>
    
    <div class="box-list-wrapper">
      <ul class="custom-presentation-list">
        <li *ngFor="let item of box1Items">{{ item }}</li>
      </ul>
    </div>
  </div>

  <div class="fawaed-box-container mini" [class.full-presentation]="isBox2Maximized" style="margin-top: 25px;">
    <div class="fawaed-zoom-control" (click)="toggleBox2Zoom()">
      <span *ngIf="!isBox2Maximized">🔍 تكبير العرض</span>
      <span *ngIf="isBox2Maximized" class="close-symbol">✕ إنهاء العرض</span>
    </div>

    <h3 class="benefit-title">📌 من فوائد {{ hadith.name }}</h3>
    
    <div class="box-list-wrapper">
      <ul class="custom-presentation-list">
        <li *ngFor="let item of box2Items">{{ item }}</li>
      </ul>
    </div>
  </div>

  <div class="fawaed-box-container mini" style="margin-top: 25px;">
    <h3 class="benefit-title">📌 توجيه تربوي للحديث</h3>
    <p class="poetic-phrase">
      {{ poeticText }}
    </p>
  </div>

  <app-footer-info />
</div>
