<div class="hadith-page-container">
  
  <!-- همسة الحديث الديناميكية -->
  <app-surah-hint
    [surahName]="'همسة من ' + ' ' + name"
    [hintText]="hintText">
  </app-surah-hint>

  <!-- أزرار التنقل الديناميكية بين الأحاديث -->
  <app-next-before-surah-meny 
    [RoutelinkBefore]="routeBefore" 
    [SurahBefore]="surahBefore"
    [RoutelinkAfter]="routeAfter" 
    [SurahNext]="surahNext"> 
  </app-next-before-surah-meny>

  <div class="hadith-page-container">

    <!-- حاوية متن الحديث الرئيسية مع دعم الزوم الكامل -->
    <div #hadithBox class="fawaed-box-container mini hadith-main-box" [class.maximized-style]="isRawiMaximized" style="margin-top: 5px; position: relative;">

      <div class="box-container">
        <app-zoom-controls
          [isMaximized]="isRawiMaximized" 
          (onToggle)="toggleRawiZoom(hadithBox)" 
          (onZoomIn)="zoomInRawi()" 
          (onZoomOut)="zoomOutRawi()">
        </app-zoom-controls>
      </div>

      <div class="verse-wrapper" [style.margin-top]="isRawiMaximized ? '70px' : '35px'">
          
          <!-- المبدل الصوتي الذكي والمطور -->
          <div class="hadith-audio-player-wrapper">
            
            <!-- أزرار التحكم الذكية بالحديث (جملة جملة) -->
            <div class="hadith-player-buttons">
              <!--⏩ الزر الأيمن: الرجوع للجملة السابقة -->
              <button class="player-nav-btn" (click)="skipToPreviousPhrase()" title="تأخير 10 ثوانٍ">
                 ⏭ 
              </button>
              
              <!-- زر التشغيل الرئيسي مع مؤشر التحميل الآمن -->
              <button class="modern-hadith-audio-btn-expanded" (click)="playHadithAudio(audioUrl)" [disabled]="isLoadingAudio">
                <!-- 1. حالة التحميل من السيرفر -->
                <ng-container *ngIf="isLoadingAudio">
                  <span class="audio-spinner"></span>
                  جاري التحميل...
                </ng-container>

                <!-- 2. الحالة العادية بعد انتهاء التحميل -->
                <ng-container *ngIf="!isLoadingAudio">
                  {{ isPlaying ? '⏸️' : '▶️' }}
                </ng-container>
              </button>

              <!-- ⏪ الزر الأيسر: التقدم للجملة التالية -->
              <button class="player-nav-btn" (click)="skipToNextPhrase()" title="تقديم 10 ثوانٍ ">
                 ⏮
              </button>
            </div>

            <!-- شريط التحكم بالوقت (Progress Slider) -->
            <div class="hadith-player-slider-container">
              <span class="time-indicator text-left">{{ currentTime | number:'1.0-0' }}ث</span>
              
              <input 
                type="range" 
                [min]="0" 
                [max]="duration" 
                [value]="currentTime" 
                (input)="onSliderChange($event)"
                class="hadith-audio-slider" />
                
              <span class="time-indicator text-right">{{ duration | number:'1.0-0' }}ث</span>
            </div>

          </div>

          <!-- عرض متن الحديث المقسم إلى جمل متحكم بها صوتياً -->
          <div class="hadith-text-full-width">
            <p class="Hadith" [style.font-size.px]="fontSizeRawi + 2" style="line-height: 2 !important; max-width: 100%;">
              @for (phrase of phrases; track $index) {
                <span [class.highlighted-phrase]="$index === currentPhraseIndex">
                  {{ phrase.text }}
                </span>
              }
            </p>
          </div>

          <!-- زر فتح/إغلاق شرح المفردات -->
          <div class="tafsir-toggle-wrapper">
            <button class="modern-tafsir-toggle-btn" (click)="toggleExplanation()">
              <span>📚 شرح الحديث والمفردات</span>
              <span class="arrow" [class.open]="isExplanationShown">▼</span>
            </button>
          </div>

          <!-- صندوق الشرح والمفردات المحمي والمعدل برمجياً -->
          <div class="tafsir-modern-box" *ngIf="isExplanationShown"
               [style.font-size.px]="fontSizeRawi"
               [style.--current-zoom.px]="fontSizeRawi">
            <div class="tafsir-header-row">
              <strong class="explanation-title-modern">📝 المفردات والشرح:</strong>
              <div class="tafsir-audio-actions">
                <!-- الميز الصوتية المحمية المفحوصة من الانهيار -->
                <button (click)="speakText(explanation)" class="modern-tafsir-audio-btn">
                  {{ !isSpeakingTafsir ? '🔊 استمع للشرح' : (isTafsirPaused ? '▶️ استئناف' : '⏸️ إيقاف مؤقت') }}
                </button>
                <button *ngIf="isSpeakingTafsir" (click)="stopSpeakingTafsir()" class="modern-tafsir-stop-btn">
                  🛑
                </button>
              </div>
            </div>

            <div [innerHTML]="explanation" class="tafsir-content-inner"></div>
            
            <div class="bottom-close-wrapper">
              <button class="modern-tafsir-close-btn-bottom" (click)="closeExplanationAndScroll(hadithBox)">
                ❌ إغلاق شرح المفردات
              </button>
            </div>
          </div>

      </div>
    </div>


<!-- الحاوية 1: (Box 1) -->
<div *ngIf="box1Items && box1Items.length > 0" #box1 
     class="fawaed-box-container mini box1-container" 
     [class.maximized-style]="maximizedBoxes[1]" 
     style="margin-top: 5px; position: relative;">

  <app-zoom-controls
    [isMaximized]="maximizedBoxes[1]"  
    (onToggle)="toggleBoxZoom(1, box1)" 
    (onZoomIn)="zoomInBox1(box1)" 
    (onZoomOut)="zoomOutBox1(box1)">
  </app-zoom-controls>

  <h2 class="benefit-title" style="font-size: 1.2em; margin: 0; font-weight: bold;">{{ box1Title }}</h2>

  <div class="box-list-wrapper">
    <ul class="custom-presentation-list">
      <li *ngFor="let item of box1Items">
        <span [innerHTML]="item"></span>
      </li>
   </ul>
  </div>
</div>
