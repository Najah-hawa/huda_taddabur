<div class="fawaed-controls-group" [class.in-full-presentation]="isMaximized">
  
  <button class="fawaed-btn-action main-zoom-btn" (click)="onToggle.emit()">
    <span>{{ isMaximized ? '✕ إنهاء العرض' : '🔍 تكبير العرض' }}</span>
  </button>

  <button class="fawaed-btn-action" (click)="onZoomIn.emit()">➕</button>
  <button class="fawaed-btn-action" (click)="onZoomOut.emit()">➖</button>

</div>
